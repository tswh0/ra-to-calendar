<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>RA to Calendar</title>
  <link rel="stylesheet" href="oat-subset.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="bar">
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <defs>
        <clipPath id="tile">
          <rect width="24" height="24" rx="5.5"></rect>
        </clipPath>
      </defs>
      <g clip-path="url(#tile)">
        <rect width="24" height="24" fill="#e21355"></rect>
        <rect width="24" height="7" fill="var(--mark-paper)"></rect>
        <circle cx="15.2" cy="15.8" r="2.35" fill="var(--mark-paper)"></circle>
      </g>
    </svg>
    <span class="wordmark">RA to Calendar</span>
  </header>

  <main>
    <section id="event-info" hidden>
      <h1 id="event-title"></h1>
      <p class="when"><span id="event-date"></span></p>
      <p id="event-venue"></p>
    </section>

    <div id="loading" class="loading" role="status" aria-label="Loading event">
      <div class="loading-copy">
        <span class="skeleton skeleton-title"></span>
        <span class="skeleton skeleton-meta"></span>
        <span class="skeleton skeleton-meta short"></span>
        <p class="loading-label" id="loading-label">Reading event</p>
      </div>
      <div class="loading-actions" aria-hidden="true">
        <span class="skeleton skeleton-button"></span>
        <span class="skeleton skeleton-button"></span>
        <span class="skeleton skeleton-hint"></span>
      </div>
    </div>

    <div id="error-message" class="error" hidden>
      <p data-role="message"></p>
      <p class="hint" data-role="hint"></p>
    </div>
  </main>

  <footer id="actions" hidden>
    <button id="download-ics" type="button">Download .ics</button>
    <button id="add-google" type="button" class="outline">Add to Google Calendar</button>
    <p class="hint">Apple Calendar, Outlook, or any app that reads .ics</p>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
